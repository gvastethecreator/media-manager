  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("codemap-data").textContent);
      const svg = document.getElementById("map-svg");
      const viewport = document.getElementById("viewport");
      const nodeWidth = 190;
      const nodeHeight = 70;
      const colors = {
        module: "var(--module)", service: "var(--service)", database: "var(--database)",
        queue: "var(--queue)", interface: "var(--interface)", external: "var(--external)"
      };
      const types = [...new Set(data.nodes.map(node => node.type))].sort();
      const state = {
        enabledTypes: new Set(types), query: "", selectedNode: null, selectedFlow: null,
        positions: new Map(), view: { x: 0, y: 0, k: 1 }, drag: null, pan: null, skipCanvasClick: false
      };

      document.getElementById("generated-at").textContent = data.generated_at;
      document.getElementById("generated-commit").textContent = data.generated_from_commit.slice(0, 12);
      document.getElementById("scope").textContent = data.scope.join(", ");

      function htmlElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function svgElement(tag, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        return element;
      }

      function visibleNodes() {
        return data.nodes.filter(node => state.enabledTypes.has(node.type));
      }

      function visibleEdges(ids) {
        return data.edges.filter(edge => ids.has(edge.from) && ids.has(edge.to));
      }

      function averageNeighborOrder(id, neighbors, order) {
        const values = neighbors.get(id)?.map(item => order.get(item)).filter(Number.isFinite) || [];
        return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : Number.MAX_SAFE_INTEGER;
      }

      function calculateLayout(nodes, edges) {
        const ids = new Set(nodes.map(node => node.id));
        const outgoing = new Map([...ids].map(id => [id, []]));
        const incoming = new Map([...ids].map(id => [id, []]));
        const indegree = new Map([...ids].map(id => [id, 0]));
        const rank = new Map([...ids].map(id => [id, 0]));
        for (const edge of edges) {
          outgoing.get(edge.from).push(edge.to);
          incoming.get(edge.to).push(edge.from);
          indegree.set(edge.to, indegree.get(edge.to) + 1);
        }
        const queue = [...ids].filter(id => indegree.get(id) === 0).sort();
        const visited = new Set();
        while (queue.length) {
          const id = queue.shift();
          visited.add(id);
          for (const target of outgoing.get(id)) {
            rank.set(target, Math.max(rank.get(target), rank.get(id) + 1));
            indegree.set(target, indegree.get(target) - 1);
            if (indegree.get(target) === 0) queue.push(target);
          }
          queue.sort();
        }
        for (const id of ids) {
          if (!visited.has(id)) {
            const parentRanks = incoming.get(id).map(parent => rank.get(parent));
            rank.set(id, parentRanks.length ? Math.min(5, Math.max(...parentRanks) + 1) : 0);
          }
        }
        const layers = new Map();
        for (const node of nodes) {
          const layer = Math.min(rank.get(node.id), 5);
          if (!layers.has(layer)) layers.set(layer, []);
          layers.get(layer).push(node.id);
        }
        for (const layer of layers.values()) layer.sort();
        for (let pass = 0; pass < 4; pass += 1) {
          const layerKeys = [...layers.keys()].sort((a, b) => a - b);
          const order = new Map();
          for (const key of layerKeys) layers.get(key).forEach((id, index) => order.set(id, index));
          for (const key of layerKeys.slice(1)) {
            layers.get(key).sort((a, b) => averageNeighborOrder(a, incoming, order) - averageNeighborOrder(b, incoming, order));
          }
          for (const key of layerKeys.slice(0, -1).reverse()) {
            layers.get(key).sort((a, b) => averageNeighborOrder(a, outgoing, order) - averageNeighborOrder(b, outgoing, order));
          }
        }
        const largestLayer = Math.max(...[...layers.values()].map(layer => layer.length), 1);
        for (const [layer, identifiers] of layers) {
          const offset = (largestLayer - identifiers.length) * 58;
          identifiers.forEach((id, index) => {
            if (!state.positions.has(id)) state.positions.set(id, { x: 55 + layer * 270, y: 55 + offset + index * 116 });
          });
        }
      }

      function graphSets(ids, edges) {
        const outgoing = new Map([...ids].map(id => [id, []]));
        const incoming = new Map([...ids].map(id => [id, []]));
        edges.forEach(edge => { outgoing.get(edge.from).push(edge.to); incoming.get(edge.to).push(edge.from); });
        const walk = (start, adjacency) => {
          const found = new Set();
          const pending = [...(adjacency.get(start) || [])];
          while (pending.length) {
            const id = pending.shift();
            if (found.has(id)) continue;
            found.add(id);
            pending.push(...(adjacency.get(id) || []));
          }
          found.delete(start);
          return found;
        };
        return {
          upstream: state.selectedNode ? walk(state.selectedNode, incoming) : new Set(),
          downstream: state.selectedNode ? walk(state.selectedNode, outgoing) : new Set()
        };
      }

      function flowPairs() {
        if (state.selectedFlow === null) return new Set();
        const steps = data.flows[state.selectedFlow].steps;
        return new Set(steps.slice(0, -1).map((id, index) => `${id}\u0000${steps[index + 1]}`));
      }

      function boundaryBoxes(nodes) {
        const groups = new Map();
        for (const node of nodes) {
          const position = state.positions.get(node.id);
          if (!groups.has(node.boundary)) groups.set(node.boundary, []);
          groups.get(node.boundary).push(position);
        }
        return [...groups].map(([name, positions]) => {
          const minX = Math.min(...positions.map(position => position.x)) - 24;
          const minY = Math.min(...positions.map(position => position.y)) - 32;
          const maxX = Math.max(...positions.map(position => position.x)) + nodeWidth + 24;
          const maxY = Math.max(...positions.map(position => position.y)) + nodeHeight + 24;
          return { name, x: minX, y: minY, width: maxX - minX, height: maxY - minY };
        });
      }

      function edgePath(source, target) {
        const startX = source.x + nodeWidth;
        const startY = source.y + nodeHeight / 2;
        const endX = target.x;
        const endY = target.y + nodeHeight / 2;
        const bend = Math.max(45, Math.abs(endX - startX) * .48);
        return `M ${startX} ${startY} C ${startX + bend} ${startY}, ${endX - bend} ${endY}, ${endX} ${endY}`;
      }

      function draw() {
        const nodes = visibleNodes();
        const ids = new Set(nodes.map(node => node.id));
        const edges = visibleEdges(ids);
        calculateLayout(nodes, edges);
        viewport.replaceChildren();
        const selection = graphSets(ids, edges);
        const selectedFlow = state.selectedFlow === null ? null : data.flows[state.selectedFlow];
        const selectedFlowNodes = new Set(selectedFlow?.steps || []);
        const selectedFlowPairs = flowPairs();
        const query = state.query.trim().toLowerCase();
        const matches = new Set(nodes.filter(node => `${node.id} ${node.path} ${node.role}`.toLowerCase().includes(query)).map(node => node.id));
        const hasFocus = Boolean(state.selectedNode || selectedFlow || query);

        for (const box of boundaryBoxes(nodes)) {
          viewport.append(svgElement("rect", { class: "boundary", x: box.x, y: box.y, width: box.width, height: box.height, rx: 12 }));
          const label = svgElement("text", { class: "boundary-label", x: box.x + 10, y: box.y + 17 });
          label.textContent = box.name;
          viewport.append(label);
        }

        for (const edge of edges) {
          const source = state.positions.get(edge.from);
          const target = state.positions.get(edge.to);
          const pair = `${edge.from}\u0000${edge.to}`;
          const classes = ["edge"];
          if (edge.evidence.status === "unknown") classes.push("unknown");
          if (selectedFlowPairs.has(pair)) classes.push("flow");
          else {
            if (state.selectedNode && selection.upstream.has(edge.from) && (selection.upstream.has(edge.to) || edge.to === state.selectedNode)) classes.push("up");
            if (state.selectedNode && (edge.from === state.selectedNode || selection.downstream.has(edge.from)) && selection.downstream.has(edge.to)) classes.push("down");
            if (classes.length === (edge.evidence.status === "unknown" ? 2 : 1) && hasFocus) classes.push("dim");
          }
          viewport.append(svgElement("path", { class: classes.join(" "), d: edgePath(source, target) }));
          const label = svgElement("text", {
            class: `edge-label${classes.includes("dim") ? " dim" : ""}`,
            x: (source.x + nodeWidth + target.x) / 2,
            y: (source.y + target.y + nodeHeight) / 2 - 6,
            "text-anchor": "middle"
          });
          label.textContent = edge.type;
          viewport.append(label);
        }

        for (const node of nodes) {
          const position = state.positions.get(node.id);
          const classes = ["node"];
          if (node.id === state.selectedNode) classes.push("focus");
          else if (selectedFlowNodes.has(node.id)) classes.push("flow");
          else {
            if (selection.upstream.has(node.id)) classes.push("up");
            if (selection.downstream.has(node.id)) classes.push("down");
            if (query && matches.has(node.id)) classes.push("match");
            if (classes.length === 1 && hasFocus) classes.push("dim");
          }
          const group = svgElement("g", {
            class: classes.join(" "), transform: `translate(${position.x} ${position.y})`,
            tabindex: "0", role: "button", "aria-label": `${node.id}: ${node.role}`,
            style: `--node-color:${colors[node.type] || "var(--module)"}`
          });
          group.dataset.nodeId = node.id;
          group.append(svgElement("rect", { width: nodeWidth, height: nodeHeight }));
          group.append(svgElement("rect", { class: "type-bar", width: 5, height: nodeHeight, rx: 3 }));
          const title = svgElement("text", { class: "node-title", x: 16, y: 27 });
          title.textContent = node.id;
          const path = svgElement("text", { class: "node-path", x: 16, y: 48 });
          path.textContent = node.path.length > 29 ? `${node.path.slice(0, 27)}…` : node.path;
          group.append(title, path);
          group.addEventListener("click", event => {
            event.stopPropagation();
            if (state.skipCanvasClick) {
              state.skipCanvasClick = false;
              return;
            }
            selectNode(node.id);
          });
          group.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(node.id); }
          });
          group.addEventListener("pointerdown", event => {
            event.stopPropagation();
            svg.setPointerCapture(event.pointerId);
            state.drag = { id: node.id, pointerId: event.pointerId, x: event.clientX, y: event.clientY, start: { ...position }, moved: false };
          });
          viewport.append(group);
        }
        applyTransform();
        updateStatus(nodes.length, edges.length);
      }

      function applyTransform() {
        viewport.setAttribute("transform", `translate(${state.view.x} ${state.view.y}) scale(${state.view.k})`);
      }

      function fitMap() {
        const nodes = visibleNodes();
        if (!nodes.length) return;
        const boxes = boundaryBoxes(nodes);
        const minX = Math.min(...boxes.map(box => box.x));
        const minY = Math.min(...boxes.map(box => box.y));
        const maxX = Math.max(...boxes.map(box => box.x + box.width));
        const maxY = Math.max(...boxes.map(box => box.y + box.height));
        const width = svg.clientWidth;
        const height = svg.clientHeight;
        state.view.k = Math.min(1.15, Math.max(.28, Math.min((width - 50) / (maxX - minX), (height - 50) / (maxY - minY))));
        state.view.x = (width - (maxX - minX) * state.view.k) / 2 - minX * state.view.k;
        state.view.y = (height - (maxY - minY) * state.view.k) / 2 - minY * state.view.k;
        applyTransform();
      }

      function setZoom(factor) {
        const next = Math.min(2.5, Math.max(.2, state.view.k * factor));
        const centerX = svg.clientWidth / 2;
        const centerY = svg.clientHeight / 2;
        state.view.x = centerX - (centerX - state.view.x) * (next / state.view.k);
        state.view.y = centerY - (centerY - state.view.y) * (next / state.view.k);
        state.view.k = next;
        applyTransform();
      }

      function selectNode(id) {
        state.selectedNode = state.selectedNode === id ? null : id;
        state.selectedFlow = null;
        renderFlows();
        renderDetails();
        draw();
      }

      function renderDetails() {
        const details = document.getElementById("details");
        details.replaceChildren();
        const node = data.nodes.find(item => item.id === state.selectedNode);
        if (!node) {
          details.append(htmlElement("p", "empty", "Select a module to inspect its role, evidence, callers, dependencies, tests, and flows."));
          return;
        }
        details.append(htmlElement("h2", "detail-title", node.id));
        details.append(htmlElement("p", "detail-path", node.path));
        const blocks = [
          ["Role", [node.role]], ["Entrypoints", node.entrypoints], ["Constraints", node.constraints],
          ["Evidence", node.evidence.locations.map(item => `${item.path}:${item.symbol}`)]
        ];
        for (const [title, values] of blocks) {
          const block = htmlElement("div", "detail-block");
          block.append(htmlElement("h3", "", title));
          if (values.length === 1) block.append(htmlElement("p", "", values[0]));
          else {
            const list = htmlElement("ul");
            values.forEach(value => list.append(htmlElement("li", "", value)));
            block.append(list);
          }
          details.append(block);
        }
        const tests = htmlElement("div", "detail-block test-list");
        tests.append(htmlElement("h3", "", "Related tests"));
        if (node.tests.length) {
          const list = htmlElement("ul");
          node.tests.forEach(value => list.append(htmlElement("li", "", value)));
          tests.append(list);
        } else tests.append(htmlElement("p", "empty", "No related test was found."));
        details.append(tests);
        const flowNames = data.flows.filter(flow => flow.steps.includes(node.id)).map(flow => flow.trigger);
        const flowBlock = htmlElement("div", "detail-block");
        flowBlock.append(htmlElement("h3", "", "Flow membership"));
        flowBlock.append(htmlElement("p", "", flowNames.length ? flowNames.join(" · ") : "No selected flow includes this node."));
        details.append(flowBlock);
      }

      function renderTypes() {
        const filters = document.getElementById("type-filters");
        const legend = document.getElementById("legend");
        filters.replaceChildren();
        legend.replaceChildren();
        for (const type of types) {
          const label = htmlElement("label", "filter");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = state.enabledTypes.has(type);
          checkbox.addEventListener("change", () => {
            checkbox.checked ? state.enabledTypes.add(type) : state.enabledTypes.delete(type);
            draw();
            fitMap();
          });
          label.append(checkbox, htmlElement("span", "swatch"), document.createTextNode(type));
          label.querySelector(".swatch").style.background = colors[type];
          filters.append(label);
          const row = htmlElement("div", "legend-row");
          const swatch = htmlElement("span", "swatch");
          swatch.style.background = colors[type];
          row.append(swatch, document.createTextNode(type));
          legend.append(row);
        }
        const meanings = [["var(--up)", "upstream"], ["var(--down)", "downstream"], ["var(--flow)", "selected flow"], ["var(--danger)", "unknown edge"]];
        meanings.forEach(([color, text]) => {
          const row = htmlElement("div", "legend-row");
          const swatch = htmlElement("span", "swatch");
          swatch.style.background = color;
          row.append(swatch, document.createTextNode(text));
          legend.append(row);
        });
      }

      function renderFlows() {
        const list = document.getElementById("flow-list");
        list.replaceChildren();
        data.flows.forEach((flow, index) => {
          const button = htmlElement("button", "flow-button", flow.trigger);
          button.type = "button";
          if (state.selectedFlow === index) button.classList.add("active");
          if (state.selectedNode && flow.steps.includes(state.selectedNode)) button.classList.add("related");
          button.append(htmlElement("small", "", `${flow.steps.join(" → ")} · ${flow.outcome}`));
          button.addEventListener("click", () => {
            state.selectedFlow = state.selectedFlow === index ? null : index;
            state.selectedNode = null;
            renderFlows();
            renderDetails();
            draw();
          });
          list.append(button);
        });
      }

      function updateStatus(nodeCount, edgeCount) {
        const unknown = data.edges.filter(edge => edge.evidence.status === "unknown").length;
        document.getElementById("status").textContent = `${nodeCount} nodes · ${edgeCount} edges · ${unknown} unknown · zoom ${Math.round(state.view.k * 100)}%`;
      }

      document.getElementById("search").addEventListener("input", event => { state.query = event.target.value; draw(); });
      document.getElementById("zoom-in").addEventListener("click", () => setZoom(1.2));
      document.getElementById("zoom-out").addEventListener("click", () => setZoom(1 / 1.2));
      document.getElementById("fit").addEventListener("click", fitMap);
      svg.addEventListener("wheel", event => { event.preventDefault(); setZoom(event.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });
      svg.addEventListener("pointerdown", event => {
        if (event.target.closest?.(".node")) return;
        svg.setPointerCapture(event.pointerId);
        state.pan = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, start: { ...state.view } };
      });
      svg.addEventListener("pointermove", event => {
        if (state.drag?.pointerId === event.pointerId) {
          const position = state.drag.start;
          if (Math.abs(event.clientX - state.drag.x) > 3 || Math.abs(event.clientY - state.drag.y) > 3) state.drag.moved = true;
          state.positions.set(state.drag.id, {
            x: position.x + (event.clientX - state.drag.x) / state.view.k,
            y: position.y + (event.clientY - state.drag.y) / state.view.k
          });
          draw();
        } else if (state.pan?.pointerId === event.pointerId) {
          state.view.x = state.pan.start.x + event.clientX - state.pan.x;
          state.view.y = state.pan.start.y + event.clientY - state.pan.y;
          applyTransform();
        }
      });
      svg.addEventListener("pointerup", event => {
        if (state.drag?.pointerId === event.pointerId) {
          const selectedId = state.drag.moved ? null : state.drag.id;
          state.drag = null;
          state.skipCanvasClick = true;
          if (selectedId) selectNode(selectedId);
        }
        if (state.pan?.pointerId === event.pointerId) state.pan = null;
      });
      svg.addEventListener("click", event => {
        if (state.skipCanvasClick) {
          state.skipCanvasClick = false;
          return;
        }
        if (event.target === svg || event.target.classList.contains("map-bg")) {
          state.selectedNode = null;
          state.selectedFlow = null;
          renderDetails();
          renderFlows();
          draw();
        }
      });
      window.addEventListener("resize", fitMap);
      document.addEventListener("keydown", event => {
        if (event.key !== "Escape" || (state.selectedNode === null && state.selectedFlow === null)) return;
        const selectedNode = state.selectedNode;
        const selectedFlow = state.selectedFlow;
        state.selectedNode = null;
        state.selectedFlow = null;
        renderDetails();
        renderFlows();
        draw();
        requestAnimationFrame(() => {
          if (selectedNode) viewport.querySelector(`[data-node-id="${CSS.escape(selectedNode)}"]`)?.focus();
          else if (selectedFlow !== null) document.querySelectorAll(".flow-button")[selectedFlow]?.focus();
        });
      });

      renderTypes();
      renderFlows();
      draw();
      requestAnimationFrame(fitMap);
    })();
  </script>
</body>
</html>
