name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
	desktop-source:
		name: Tauri source check (Windows)
		runs-on: windows-latest
		timeout-minutes: 20
		steps:
			- uses: actions/checkout@v4
			- uses: oven-sh/setup-bun@v2
				with:
					bun-version: 1.3.14
			- run: bun install --frozen-lockfile
			- run: bun run build
			- run: cargo check --manifest-path src-tauri/Cargo.toml --locked

	verify:
    name: Check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:tooling
      - run: bun run test
      - run: bun run build
