<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Context Menu</title>
  <style>
    .test-item {
      width: 200px;
      height: 100px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      margin: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .context-menu {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 5px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <h1>Test Context Menu</h1>
  <div class="test-item" id="test1">
    Item 1 - Click derecho aquí
  </div>
  <div class="test-item" id="test2">
    Item 2 - Click derecho aquí
  </div>

  <div class="context-menu" id="contextMenu">
    <div>Opción 1</div>
    <div>Opción 2</div>
    <div>Opción 3</div>
  </div>

  <script>
    // Test básico de context menu
    document.addEventListener('contextmenu', function (e) {
      console.log('Context menu event triggered:', e.target);

      if (e.target.classList.contains('test-item')) {
        e.preventDefault();

        const menu = document.getElementById('contextMenu');
        menu.style.display = 'block';
        menu.style.left = e.pageX + 'px';
        menu.style.top = e.pageY + 'px';
      }
    });

    document.addEventListener('click', function () {
      document.getElementById('contextMenu').style.display = 'none';
    });
  </script>
</body>

</html>
